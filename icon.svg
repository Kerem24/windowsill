<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="800" height="1000" role="img" aria-label="Leafy plant in a white pot on a windowsill" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="arch">
      <path d="M0 500 V200 A200 200 0 0 1 400 200 V500 Z"/>
    </clipPath>
    <!-- one leaf shape, drawn from its bottom-left point -->
    <path id="leaf" d="M0 0 A88 130 0 0 1 88 -130 A88 130 0 0 1 0 0 Z"/>
  </defs>

  <g clip-path="url(#arch)">
    <!-- window -->
    <rect width="400" height="500" fill="#f0c93a"/>

    <!-- stem -->
    <rect x="198" y="180" width="4" height="180" fill="#1f4d3a"/>

    <!-- leaves -->
    <use href="#leaf" fill="#1f4d3a" transform="translate(200 300) rotate(-20)"/>
    <use href="#leaf" fill="#2f6b50" transform="translate(200 300) rotate(35) scale(.85)"/>
    <use href="#leaf" fill="#2f6b50" transform="translate(200 240) rotate(-60) scale(.8)"/>
    <use href="#leaf" fill="#1f4d3a" transform="translate(200 210) rotate(10) scale(.7)"/>

    <!-- pot -->
    <polygon points="124,355 276,355 254.7,455 145.3,455" fill="#f7f5ee"/>

    <!-- sill -->
    <rect y="455" width="400" height="45" fill="#17251f"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
